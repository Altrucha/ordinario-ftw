<!doctype html>
<html lang="es">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Autores - Biblioteca Digital</title>
        <link rel="stylesheet" href="configuracion-vista.css" />
    </head>
    <body>
        <div id="componente_header"></div>
        <main class="autores_main">
            <div class="autores_container">
                <div class="autores_header">
                    <h2>Autores</h2>
                    <p>
                        Descubre los autores disponibles en nuestra biblioteca y
                        explora sus obras desde el catálogo.
                    </p>
                </div>
                <div style="overflow-x: auto">
                    <table
                        class="tabla_datos"
                        id="tabla_autores"
                        aria-label="Lista de autores disponibles"
                    >
                        <thead>
                            <tr>
                                <th scope="col">Nombre del autor</th>
                                <th scope="col">Disponibles</th>
                                <th scope="col">Acciones</th>
                            </tr>
                        </thead>
                        <tbody id="cuerpo_tabla_autores"></tbody>
                    </table>
                </div>
                <div
                    id="autores_vacio"
                    class="autores_vacio oculto"
                    role="alert"
                >
                    No hay autores disponibles.
                </div>
            </div>
        </main>
        <div id="componente_footer"></div>
        <script src="biblioteca.js"></script>
        <script src="autores.js"></script>
    </body>
</html>
