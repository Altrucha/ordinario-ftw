<!doctype html>
<html lang="es">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Inicio - Biblioteca Digital</title>
        <link rel="stylesheet" href="configuracion-vista.css" />
    </head>
    <body>
        <div id="componente_header"></div>
        <main>
            <section class="presentacion">
                <div class="presentacion_contenido">
                    <img
                        src="logo.png"
                        alt="Logo Biblioteca Digital"
                        class="presentacion_logo"
                    />
                    <h1>Bienvenido a Biblioteca Digital</h1>
                    <p>
                        Explora una colección de obras clásicas y contemporáneas
                    </p>
                    <div
                        class="detalle_boton_grupo"
                        style="justify-content: center"
                    >
                        <a href="catalogo.html" class="boton_primario"
                            >Ver catálogo</a
                        >
                        <a href="autores.html" class="boton_primario"
                            >Ver autores</a
                        >
                    </div>
                </div>
            </section>
            <section
                class="categorias_seccion"
                aria-labelledby="titulo_categorias"
            >
                <div class="container">
                    <h2 id="titulo_categorias" class="mb-lg">
                        Géneros disponibles
                    </h2>
                    <div style="overflow-x: auto">
                        <table
                            class="tabla_datos"
                            aria-describedby="titulo_categorias"
                        >
                            <thead>
                                <tr>
                                    <th scope="col">Género</th>
                                    <th scope="col">Disponibles</th>
                                    <th scope="col">Acciones</th>
                                </tr>
                            </thead>
                            <tbody id="cuerpo_tabla_generos"></tbody>
                        </table>
                    </div>
                </div>
            </section>
        </main>
        <div id="componente_footer"></div>
        <script src="biblioteca.js"></script>
        <script src="inicio.js"></script>
    </body>
</html>
