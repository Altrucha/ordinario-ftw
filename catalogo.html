<!doctype html>
<html lang="es">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Catálogo - Biblioteca Digital</title>
        <link rel="stylesheet" href="configuracion-vista.css" />
    </head>
    <body>
        <div id="componente_header"></div>
        <main class="catalogo_main">
            <div class="catalogo-container">
                <aside class="filtros_panel" aria-labelledby="titulo_filtros">
                    <h3 id="titulo_filtros">Filtros</h3>
                    <div class="filtro_grupo">
                        <label for="busqueda">Buscar por título o autor</label>
                        <input
                            type="text"
                            id="busqueda"
                            class="input"
                            placeholder="Ej: Quijote"
                        />
                    </div>
                    <div class="filtro_grupo">
                        <label for="ordenamiento">Ordenar por</label>
                        <select id="ordenamiento" class="select">
                            <option value="titulo_ascendente">
                                Título (A-Z)
                            </option>
                            <option value="titulo-descendente">
                                Título (Z-A)
                            </option>
                            <option value="anio-ascendente">
                                Año (más viejos)
                            </option>
                            <option value="anio-descendente">
                                Año (más nuevos)
                            </option>
                        </select>
                    </div>
                    <div class="filtro_acciones">
                        <button
                            id="limpiar_filtros"
                            class="btn boton_secundario"
                            style="width: 100%"
                        >
                            Limpiar filtros
                        </button>
                    </div>
                </aside>
                <div
                    class="catalogo_contenido"
                    aria-labelledby="titulo_catalogo"
                >
                    <div class="catalogo_header">
                        <h2 id="titulo_catalogo">Catálogo</h2>
                        <p id="resultados_info" aria-live="polite">
                            Cargando catálogo...
                        </p>
                    </div>
                    <div style="overflow-x: auto">
                        <table
                            class="tabla_datos"
                            id="tabla_libros"
                            aria-describedby="resultados_info"
                        >
                            <thead>
                                <tr>
                                    <th scope="col">Portada</th>
                                    <th scope="col">Título</th>
                                    <th scope="col">Autor</th>
                                    <th scope="col">Género</th>
                                    <th scope="col">Año</th>
                                    <th scope="col">Acciones</th>
                                </tr>
                            </thead>
                            <tbody id="cuerpo_tabla_libros"></tbody>
                        </table>
                    </div>
                    <div
                        id="no_resultados"
                        class="no_resultados oculto"
                        role="alert"
                    >
                        <p>
                            No se encontraron libros que coincidan con tu
                            búsqueda.
                        </p>
                    </div>
                </div>
            </div>
        </main>
        <div id="componente_footer"></div>
        <script src="biblioteca.js"></script>
        <script src="catalogo.js"></script>
    </body>
</html>
