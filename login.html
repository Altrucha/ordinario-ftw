<!doctype html>
<html lang="es">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Login - Biblioteca Digital</title>
        <link rel="stylesheet" href="configuracion_vista.css" />
    </head>
    <body>
        <div id="componente_encabezado"></div>
        <main class="contenedor_principal">
            <section
                class="tarjeta_interactiva login_tarjeta"
                aria-labelledby="titulo_login"
            >
                <div class="login_encabezado texto_centro">
                    <h2 id="titulo_login">Iniciar sesión</h2>
                    <p>
                        Ingresa tus credenciales para acceder a Biblioteca
                        Digital.
                    </p>
                </div>
                <form
                    id="formulario_login"
                    class="formulario_login"
                    aria-describedby="mensaje_error"
                >
                    <div class="grupo_filtro texto_centro">
                        <label for="nombre_usuario">Usuario</label>
                        <input
                            class="input"
                            type="text"
                            id="nombre_usuario"
                            name="nombre_usuario"
                            required
                            aria-required="true"
                        />
                    </div>
                    <div class="grupo_filtro texto_centro">
                        <label for="contrasenia">Contraseña</label>
                        <input
                            class="input"
                            type="password"
                            id="contrasenia"
                            name="contrasenia"
                            required
                            aria-required="true"
                        />
                    </div>
                    <button type="submit" class="boton_primario">
                        Ingresar
                    </button>
                    <div
                        id="mensaje_error"
                        class="oculto texto_error mt-sm texto_centro"
                    ></div>
                </form>
            </section>
        </main>
        <div id="componente_pie_pagina"></div>
        <script src="biblioteca.js"></script>
        <script src="login.js"></script>
    </body>
</html>
